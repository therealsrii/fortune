<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cog in the Wheel</title>
    <meta name="description" content="A perspective by Sri.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=7">
</head>
<body>
    <main class="page">
        <nav class="site-nav">
            <a class="site-name" href="./index.html">Cog in the Wheel</a>
            <span><a href="./index.html#perspectives-heading">Perspectives</a><a href="./gallery.html">Gallery</a></span>
        </nav>

        <article class="essay">
            <h1 class="essay-title" id="post-title">Loading…</h1>
            <div class="essay-meta" id="post-meta"></div>
            <div id="post-body"></div>
        </article>

        <p class="footer-line"><a href="./index.html">&larr; Back to the home page</a></p>
    </main>

    <script src="./perspectives.js"></script>
    <script>
        (function () {
            var id = new URLSearchParams(window.location.search).get('id');
            var post = PERSPECTIVES.find(function (p) { return p.id === id; });
            var titleEl = document.getElementById('post-title');
            var bodyEl = document.getElementById('post-body');

            if (!post) {
                titleEl.textContent = 'Not found';
                bodyEl.innerHTML = '<p>That piece doesn’t exist. <a href="./index.html">Go back to the home page</a>.</p>';
                document.title = 'Not found · Cog in the Wheel';
                return;
            }

            titleEl.textContent = post.title;
            document.getElementById('post-meta').textContent = post.tag;
            document.title = post.title + ' · Cog in the Wheel';
            document.querySelector('meta[name="description"]').setAttribute('content', post.summary);

            fetch('./posts/' + post.id + '.html')
                .then(function (r) {
                    if (!r.ok) throw new Error('Missing post body');
                    return r.text();
                })
                .then(function (html) { bodyEl.innerHTML = html; })
                .catch(function () {
                    bodyEl.innerHTML = '<p>This piece could not be loaded. Please try again later.</p>';
                });
        })();
    </script>
</body>
</html>
